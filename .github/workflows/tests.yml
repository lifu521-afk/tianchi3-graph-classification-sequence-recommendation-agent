name: tests
on:
  push:
  pull_request:
jobs:
  public-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src agent tests
      - run: python -m unittest discover -s tests -v
      - run: python -m agent.agent --dry-run --max-rounds 1
